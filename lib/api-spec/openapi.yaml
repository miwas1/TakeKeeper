openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: TakeKeeper production workflow API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: projects
  - name: scenes
  - name: shots
  - name: takes
  - name: continuity
  - name: media
  - name: reports
  - name: screenplay
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the current production overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List persisted production activity
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project with its scenes
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its media
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/scenes:
    get:
      operationId: listScenes
      tags: [scenes]
      summary: List scenes in a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Scenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"
    post:
      operationId: createScene
      tags: [scenes]
      summary: Create a scene
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "201":
          description: Created scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /scenes/{sceneId}:
    get:
      operationId: getScene
      tags: [scenes]
      summary: Get a scene workspace
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Scene workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneWorkspace"
    patch:
      operationId: updateScene
      tags: [scenes]
      summary: Update a scene
      parameters:
        - $ref: "#/components/parameters/SceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneUpdate"
      responses:
        "200":
          description: Updated scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /scenes/{sceneId}/shots:
    get:
      operationId: listShots
      tags: [shots]
      summary: List shots in a scene
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Shots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shot"
    post:
      operationId: createShot
      tags: [shots]
      summary: Create a shot
      parameters:
        - $ref: "#/components/parameters/SceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotInput"
      responses:
        "201":
          description: Created shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
  /shots/{shotId}:
    get:
      operationId: getShot
      tags: [shots]
      summary: Get a shot with takes and reference
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Shot workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotWorkspace"
    patch:
      operationId: updateShot
      tags: [shots]
      summary: Update a shot
      parameters:
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotUpdate"
      responses:
        "200":
          description: Updated shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
    delete:
      operationId: deleteShot
      tags: [shots]
      summary: Delete a shot
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "204":
          description: Deleted
  /shots/{shotId}/takes:
    get:
      operationId: listTakes
      tags: [takes]
      summary: List takes for a shot
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Takes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Take"
    post:
      operationId: createTake
      tags: [takes]
      summary: Create a take
      parameters:
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeInput"
      responses:
        "201":
          description: Created take
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
  /takes/{takeId}:
    patch:
      operationId: updateTake
      tags: [takes]
      summary: Update take status, notes, or circle state
      parameters:
        - $ref: "#/components/parameters/TakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeUpdate"
      responses:
        "200":
          description: Updated take
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
    delete:
      operationId: deleteTake
      tags: [takes]
      summary: Delete a take and its media
      parameters:
        - $ref: "#/components/parameters/TakeId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /scenes/{sceneId}/continuity:
    get:
      operationId: listContinuityItems
      tags: [continuity]
      summary: List continuity bible items
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Continuity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinuityItem"
    post:
      operationId: createContinuityItem
      tags: [continuity]
      summary: Add a manual continuity item
      parameters:
        - $ref: "#/components/parameters/SceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityItem"
  /continuity/{itemId}:
    patch:
      operationId: updateContinuityItem
      tags: [continuity]
      summary: Update a continuity item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityItem"
    delete:
      operationId: deleteContinuityItem
      tags: [continuity]
      summary: Delete a continuity item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Deleted
  /continuity/{itemId}/changes:
    post:
      operationId: createContinuityChange
      tags: [continuity]
      summary: Apply an intentional continuity change
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityChangeInput"
      responses:
        "201":
          description: Applied state change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityItem"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [media]
      summary: Request a direct media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTarget"
  /media:
    post:
      operationId: registerMedia
      tags: [media]
      summary: Register uploaded media metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Registered media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
  /media/{mediaId}:
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete an unattached media object
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [reports]
      summary: Get the daily report shell
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
      responses:
        "200":
          description: Report readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
  /projects/{projectId}/screenplay-import:
    get:
      operationId: getScreenplayImport
      tags: [screenplay]
      summary: Get the latest screenplay import
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Latest screenplay import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createScreenplayImport
      tags: [screenplay]
      summary: Save and analyze screenplay text
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenplayImportInput"
      responses:
        "202":
          description: Screenplay saved and analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
  /screenplay-imports/{importId}:
    patch:
      operationId: updateScreenplayImport
      tags: [screenplay]
      summary: Save screenplay review edits
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenplayImportUpdate"
      responses:
        "200":
          description: Updated screenplay import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
    post:
      operationId: approveScreenplayImport
      tags: [screenplay]
      summary: Approve screenplay scenes and continuity items
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenplayApprovalInput"
      responses:
        "200":
          description: Approved screenplay import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
  /screenplay-imports/{importId}/retry:
    post:
      operationId: retryScreenplayImport
      tags: [screenplay]
      summary: Retry the latest screenplay analysis
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "202":
          description: Analysis restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    ProjectIdQuery:
      name: projectId
      in: query
      required: true
      schema: { type: string }
    SceneId:
      name: sceneId
      in: path
      required: true
      schema: { type: string }
    ShotId:
      name: shotId
      in: path
      required: true
      schema: { type: string }
    TakeId:
      name: takeId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
        database: { type: string }
      required: [status, database]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
      required: [error]
    Project:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        sceneCount: { type: number }
        activeIssueCount: { type: number }
        updatedAt: { type: string, format: date-time }
      required: [id, title, type, status, sceneCount, activeIssueCount, updatedAt]
    ProjectInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string, default: short_film }
      required: [title]
    ProjectUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string }
        status: { type: string }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            scenes:
              type: array
              items: { $ref: "#/components/schemas/Scene" }
          required: [scenes]
    Scene:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        sceneNumber: { type: string }
        slugline: { type: string }
        location: { type: string }
        intExt: { type: string }
        timeOfDay: { type: string }
        storyDay: { type: string }
        scriptText: { type: [string, "null"] }
        shotCount: { type: number }
        continuityCount: { type: number }
        sortOrder: { type: number }
      required: [id, projectId, sceneNumber, slugline, location, intExt, timeOfDay, storyDay, shotCount, continuityCount, sortOrder]
    SceneInput:
      type: object
      properties:
        sceneNumber: { type: string, minLength: 1 }
        slugline: { type: string, minLength: 1 }
        location: { type: string }
        intExt: { type: string }
        timeOfDay: { type: string }
        storyDay: { type: string }
        scriptText: { type: string }
      required: [sceneNumber, slugline]
    SceneUpdate:
      type: object
      properties:
        sceneNumber: { type: string, minLength: 1 }
        slugline: { type: string, minLength: 1 }
        location: { type: string }
        intExt: { type: string }
        timeOfDay: { type: string }
        storyDay: { type: string }
        scriptText: { type: string }
    Shot:
      type: object
      properties:
        id: { type: string }
        sceneId: { type: string }
        label: { type: string }
        description: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        status: { type: string }
        takeCount: { type: number }
        issueCount: { type: number }
        referenceTakeId: { type: [string, "null"] }
      required: [id, sceneId, label, description, notes, status, takeCount, issueCount, referenceTakeId]
    ShotInput:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        description: { type: string }
        notes: { type: string }
      required: [label]
    ShotUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        description: { type: string }
        notes: { type: string }
        status: { type: string }
    Take:
      type: object
      properties:
        id: { type: string }
        shotId: { type: string }
        takeNumber: { type: number }
        status: { type: string }
        notes: { type: [string, "null"] }
        capturedAt: { type: string, format: date-time }
        isReference: { type: boolean }
        isCircle: { type: boolean }
        referenceStatus: { type: string, enum: [none, active, superseded] }
        issueCount: { type: number }
        mediaUrl: { type: [string, "null"] }
      required: [id, shotId, takeNumber, status, notes, capturedAt, isReference, isCircle, referenceStatus, issueCount, mediaUrl]
    TakeInput:
      type: object
      properties:
        notes: { type: string }
        isReference: { type: boolean }
        mediaId: { type: string }
        submissionKey: { type: string, minLength: 1, maxLength: 120 }
      required: []
    TakeUpdate:
      type: object
      properties:
        status: { type: string }
        notes: { type: string }
        isReference: { type: boolean }
        isCircle: { type: boolean }
    ContinuityItem:
      type: object
      properties:
        id: { type: string }
        sceneId: { type: string }
        category: { type: string }
        entity: { type: string }
        expectedState: { type: string }
        sourceType: { type: string }
        confidence: { type: [number, "null"] }
        active: { type: boolean }
        updatedAt: { type: string, format: date-time }
      required: [id, sceneId, category, entity, expectedState, sourceType, confidence, active, updatedAt]
    ContinuityItemInput:
      type: object
      properties:
        category: { type: string }
        entity: { type: string, minLength: 1 }
        expectedState: { type: string, minLength: 1 }
        sourceType: { type: string, default: manual }
        confidence: { type: number }
      required: [category, entity, expectedState]
    ContinuityItemUpdate:
      type: object
      properties:
        category: { type: string }
        entity: { type: string, minLength: 1 }
        expectedState: { type: string, minLength: 1 }
        confidence: { type: number }
        active: { type: boolean }
    ContinuityChangeInput:
      type: object
      properties:
        newState: { type: string, minLength: 1 }
        effectiveScope: { type: string }
        sourceTakeId: { type: string }
      required: [newState, effectiveScope, sourceTakeId]
    Media:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        sceneId: { type: [string, "null"] }
        takeId: { type: [string, "null"] }
        storageKey: { type: string }
        mediaType: { type: string }
        mediaUrl: { type: string }
        width: { type: [number, "null"] }
        height: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, projectId, sceneId, takeId, storageKey, mediaType, mediaUrl, width, height, createdAt]
    UploadRequest:
      type: object
      properties:
        projectId: { type: string }
        sceneId: { type: string }
        fileName: { type: string, minLength: 1 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: number, maximum: 20971520 }
      required: [projectId, fileName, contentType, size]
    UploadTarget:
      type: object
      properties:
        storageKey: { type: string }
        uploadUrl: { type: string }
      required: [storageKey, uploadUrl]
    MediaInput:
      type: object
      properties:
        projectId: { type: string }
        sceneId: { type: string }
        takeId: { type: string }
        storageKey: { type: string }
        mediaType: { type: string }
        width: { type: number }
        height: { type: number }
      required: [projectId, storageKey, mediaType]
    ActivityEvent:
      type: object
      properties:
        id: { type: string }
        agent: { type: string }
        action: { type: string }
        status: { type: string }
        latencyMs: { type: [number, "null"] }
        createdAt: { type: string, format: date-time }
        projectTitle: { type: [string, "null"] }
      required: [id, agent, action, status, createdAt, projectTitle]
    Dashboard:
      type: object
      properties:
        activeProjectCount: { type: number }
        sceneCount: { type: number }
        openIssueCount: { type: number }
        circledTakeCount: { type: number }
        projects:
          type: array
          items: { $ref: "#/components/schemas/Project" }
        recentActivity:
          type: array
          items: { $ref: "#/components/schemas/ActivityEvent" }
      required: [activeProjectCount, sceneCount, openIssueCount, circledTakeCount, projects, recentActivity]
    SceneWorkspace:
      type: object
      properties:
        scene: { $ref: "#/components/schemas/Scene" }
        continuity:
          type: array
          items: { $ref: "#/components/schemas/ContinuityItem" }
        shots:
          type: array
          items: { $ref: "#/components/schemas/Shot" }
      required: [scene, continuity, shots]
    ShotWorkspace:
      type: object
      properties:
        shot: { $ref: "#/components/schemas/Shot" }
        scene: { $ref: "#/components/schemas/Scene" }
        takes:
          type: array
          items: { $ref: "#/components/schemas/Take" }
      required: [shot, scene, takes]
    DailyReport:
      type: object
      properties:
        available: { type: boolean }
        message: { type: string }
        project: { type: [string, "null"] }
        shootDate: { type: [string, "null"] }
        scenesWorked: { type: number }
        shots: { type: number }
        takeCount: { type: number }
        circleTakes: { type: number }
        issuesCaught: { type: number }
        unresolvedWarnings: { type: number }
      required: [available, message, project, shootDate, scenesWorked, shots, takeCount, circleTakes, issuesCaught, unresolvedWarnings]
    ScreenplayImportInput:
      type: object
      properties:
        sourceType: { type: string, enum: [paste, txt] }
        fileName: { type: [string, "null"] }
        content: { type: string, minLength: 40 }
      required: [sourceType, content]
    ScreenplayImportUpdate:
      type: object
      properties:
        analysis: { $ref: "#/components/schemas/ScreenplayBreakdown" }
      required: [analysis]
    ScreenplayApprovalInput:
      type: object
      properties:
        analysis: { $ref: "#/components/schemas/ScreenplayBreakdown" }
      required: [analysis]
    ScreenplayImport:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        sourceType: { type: string, enum: [paste, txt] }
        fileName: { type: [string, "null"] }
        content: { type: string }
        status: { type: string, enum: [analyzing, review, approved, failed] }
        errorMessage: { type: [string, "null"] }
        model: { type: [string, "null"] }
        analysis:
          oneOf:
            - $ref: "#/components/schemas/ScreenplayBreakdown"
            - type: "null"
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, projectId, sourceType, fileName, content, status, errorMessage, model, analysis, createdAt, updatedAt]
    ScreenplayBreakdown:
      type: object
      properties:
        scenes:
          type: array
          items: { $ref: "#/components/schemas/ScreenplayScene" }
      required: [scenes]
    ScreenplayScene:
      type: object
      properties:
        id: { type: [string, "null"] }
        sceneNumber: { type: string }
        slugline: { type: string }
        location: { type: string }
        intExt: { type: string, enum: [INT, EXT, INT/EXT, ""] }
        timeOfDay: { type: string }
        storyDay: { type: string }
        scriptText: { type: [string, "null"] }
        characters:
          type: array
          items: { type: string }
        continuityItems:
          type: array
          items: { $ref: "#/components/schemas/ScreenplayContinuityItem" }
      required: [sceneNumber, slugline, location, intExt, timeOfDay, storyDay, scriptText, characters, continuityItems]
    ScreenplayContinuityItem:
      type: object
      properties:
        category: { type: string }
        entity: { type: string }
        expectedState: { type: string }
        sourceType: { type: string, enum: [script] }
        confidence: { type: number, minimum: 0, maximum: 1 }
        active: { type: boolean }
        sourceEvidence: { type: [string, "null"] }
      required: [category, entity, expectedState, sourceType, confidence, active, sourceEvidence]
