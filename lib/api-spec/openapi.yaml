openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: TakeKeeper production workflow API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: dashboard
  - name: projects
  - name: scenes
  - name: shots
  - name: takes
  - name: continuity
  - name: media
  - name: reports
  - name: screenplay
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get the current production overview
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List persisted production activity
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/ActivityAgent"
        - $ref: "#/components/parameters/ActivityStatus"
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityEvent"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project with its scenes
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetail"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project and its media
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/scenes:
    get:
      operationId: listScenes
      tags: [scenes]
      summary: List scenes in a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Scenes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"
    post:
      operationId: createScene
      tags: [scenes]
      summary: Create a scene
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneInput"
      responses:
        "201":
          description: Created scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /scenes/{sceneId}:
    get:
      operationId: getScene
      tags: [scenes]
      summary: Get a scene workspace
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Scene workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SceneWorkspace"
    patch:
      operationId: updateScene
      tags: [scenes]
      summary: Update a scene
      parameters:
        - $ref: "#/components/parameters/SceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SceneUpdate"
      responses:
        "200":
          description: Updated scene
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
  /scenes/{sceneId}/shots:
    get:
      operationId: listShots
      tags: [shots]
      summary: List shots in a scene
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Shots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shot"
    post:
      operationId: createShot
      tags: [shots]
      summary: Create a shot
      parameters:
        - $ref: "#/components/parameters/SceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotInput"
      responses:
        "201":
          description: Created shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
  /shots/{shotId}:
    get:
      operationId: getShot
      tags: [shots]
      summary: Get a shot with takes and reference
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Shot workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShotWorkspace"
    patch:
      operationId: updateShot
      tags: [shots]
      summary: Update a shot
      parameters:
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShotUpdate"
      responses:
        "200":
          description: Updated shot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shot"
    delete:
      operationId: deleteShot
      tags: [shots]
      summary: Delete a shot
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "204":
          description: Deleted
  /shots/{shotId}/takes:
    get:
      operationId: listTakes
      tags: [takes]
      summary: List takes for a shot
      parameters:
        - $ref: "#/components/parameters/ShotId"
      responses:
        "200":
          description: Takes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Take"
    post:
      operationId: createTake
      tags: [takes]
      summary: Create a take
      parameters:
        - $ref: "#/components/parameters/ShotId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeInput"
      responses:
        "201":
          description: Created take
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
  /takes/{takeId}:
    patch:
      operationId: updateTake
      tags: [takes]
      summary: Update take status, notes, or circle state
      parameters:
        - $ref: "#/components/parameters/TakeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TakeUpdate"
      responses:
        "200":
          description: Updated take
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Take"
    delete:
      operationId: deleteTake
      tags: [takes]
      summary: Delete a take and its media
      parameters:
        - $ref: "#/components/parameters/TakeId"
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /scenes/{sceneId}/continuity:
    get:
      operationId: listContinuityItems
      tags: [continuity]
      summary: List continuity bible items
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Continuity items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinuityItem"
    post:
      operationId: createContinuityItem
      tags: [continuity]
      summary: Add a manual continuity item
      parameters:
        - $ref: "#/components/parameters/SceneId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityItemInput"
      responses:
        "201":
          description: Created item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityItem"
  /scenes/{sceneId}/continuity/history:
    get:
      operationId: getContinuityHistory
      tags: [continuity]
      summary: List approved continuity state history for a scene
      parameters:
        - $ref: "#/components/parameters/SceneId"
      responses:
        "200":
          description: Continuity state history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinuityHistoryEntry"
        "404":
          $ref: "#/components/responses/NotFound"
  /continuity/{itemId}:
    patch:
      operationId: updateContinuityItem
      tags: [continuity]
      summary: Update a continuity item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityItemUpdate"
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityItem"
    delete:
      operationId: deleteContinuityItem
      tags: [continuity]
      summary: Delete a continuity item
      parameters:
        - $ref: "#/components/parameters/ItemId"
      responses:
        "204":
          description: Deleted
  /continuity/{itemId}/changes:
    post:
      operationId: createContinuityChange
      tags: [continuity]
      summary: Apply an intentional continuity change
      parameters:
        - $ref: "#/components/parameters/ItemId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityChangeInput"
      responses:
        "201":
          description: Applied state change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityItem"
  /continuity/issues/{issueId}:
    patch:
      operationId: decideContinuityIssue
      tags: [continuity]
      summary: Record a human continuity issue decision
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityIssueDecisionInput"
      responses:
        "200":
          description: Recorded decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityDecisionResponse"
  /continuity/issues/{issueId}/history:
    get:
      operationId: getContinuityIssueHistory
      tags: [continuity]
      summary: List issue decisions and notes
      parameters:
        - $ref: "#/components/parameters/IssueId"
      responses:
        "200":
          description: Issue history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityIssueHistory"
        "404":
          $ref: "#/components/responses/NotFound"
  /continuity/issues/{issueId}/notes:
    post:
      operationId: addContinuityIssueNote
      tags: [continuity]
      summary: Add a note to a continuity issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityIssueNoteInput"
      responses:
        "201":
          description: Updated issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityIssue"
  /continuity/issues/{issueId}/ignore:
    post:
      operationId: ignoreContinuityIssue
      tags: [continuity]
      summary: Ignore a continuity issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityIssueNoteInput"
      responses:
        "200":
          description: Ignored issue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityIssue"
  /continuity/issues/{issueId}/intentional:
    post:
      operationId: approveContinuityIssueChange
      tags: [continuity]
      summary: Approve an intentional continuity change
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityChangeInput"
      responses:
        "201":
          description: Approved continuity change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityDecision"
  /continuity/issues/{issueId}/recheck:
    post:
      operationId: recheckContinuityIssue
      tags: [continuity]
      summary: Run a new continuity check for an issue
      parameters:
        - $ref: "#/components/parameters/IssueId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityRecheckInput"
      responses:
        "202":
          description: Recheck started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityCheck"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [media]
      summary: Request a direct media upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTarget"
  /media:
    post:
      operationId: registerMedia
      tags: [media]
      summary: Register uploaded media metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Registered media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"
  /media/{mediaId}:
    delete:
      operationId: deleteMedia
      tags: [media]
      summary: Delete an unattached media object
      parameters:
        - name: mediaId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /reports/daily:
    get:
      operationId: getDailyReport
      tags: [reports]
      summary: Get a persisted daily production report
      parameters:
        - $ref: "#/components/parameters/ProjectIdQuery"
        - name: shootDate
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        "200":
          description: Daily report and current factual records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
    post:
      operationId: generateDailyReport
      tags: [reports]
      summary: Generate and persist a daily production report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateDailyReportInput"
      responses:
        "200":
          description: Generated report or safe generation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyReport"
  /projects/{projectId}/screenplay-import:
    get:
      operationId: getScreenplayImport
      tags: [screenplay]
      summary: Get the latest screenplay import
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Latest screenplay import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createScreenplayImport
      tags: [screenplay]
      summary: Save and analyze screenplay text
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenplayImportInput"
      responses:
        "202":
          description: Screenplay saved and analysis started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
  /screenplay-imports/{importId}:
    patch:
      operationId: updateScreenplayImport
      tags: [screenplay]
      summary: Save screenplay review edits
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenplayImportUpdate"
      responses:
        "200":
          description: Updated screenplay import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
    post:
      operationId: approveScreenplayImport
      tags: [screenplay]
      summary: Approve screenplay scenes and continuity items
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenplayApprovalInput"
      responses:
        "200":
          description: Approved screenplay import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
  /screenplay-imports/{importId}/retry:
    post:
      operationId: retryScreenplayImport
      tags: [screenplay]
      summary: Retry the latest screenplay analysis
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "202":
          description: Analysis restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreenplayImport"
  /takes/{takeId}/visual-state:
    get:
      operationId: getTakeVisualState
      tags: [continuity]
      summary: Get the latest Visual State analysis for a take
      parameters:
        - $ref: "#/components/parameters/TakeId"
      responses:
        "200":
          description: Visual State analysis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualStateAnalysis"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: analyzeTakeVisualState
      tags: [continuity]
      summary: Analyze a take image with the Visual State Agent
      parameters:
        - $ref: "#/components/parameters/TakeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisualStateAnalysisInput"
      responses:
        "202":
          description: Visual State analysis started or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisualStateAnalysis"
        "404":
          $ref: "#/components/responses/NotFound"
  /takes/{takeId}/continuity-check:
    get:
      operationId: getContinuityCheck
      tags: [continuity]
      summary: Get the latest continuity comparison for a take
      parameters:
        - $ref: "#/components/parameters/TakeId"
      responses:
        "200":
          description: Continuity comparison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityCheck"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: runContinuityCheck
      tags: [continuity]
      summary: Run the Continuity Supervisor for a take
      parameters:
        - $ref: "#/components/parameters/TakeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContinuityCheckInput"
      responses:
        "202":
          description: Continuity check started or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContinuityCheck"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
    ProjectIdQuery:
      name: projectId
      in: query
      required: true
      schema: { type: string }
    SceneId:
      name: sceneId
      in: path
      required: true
      schema: { type: string }
    ShotId:
      name: shotId
      in: path
      required: true
      schema: { type: string }
    TakeId:
      name: takeId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    IssueId:
      name: issueId
      in: path
      required: true
      schema: { type: string }
    ImportId:
      name: importId
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: number
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: number
        minimum: 0
        maximum: 10000
        default: 0
    ActivityAgent:
      name: agent
      in: query
      required: false
      schema: { type: string }
    ActivityStatus:
      name: status
      in: query
      required: false
      schema: { type: string, enum: [started, completed, failed] }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  schemas:
    HealthStatus:
      type: object
      properties:
        status: { type: string }
        database: { type: string }
        environment: { type: string }
        auth: { type: string }
        latestAgentLatencyMs: { type: [number, "null"] }
        agent: { $ref: "#/components/schemas/AgentReadiness" }
        storage: { $ref: "#/components/schemas/StorageReadiness" }
      required: [status, database, environment, auth, latestAgentLatencyMs, agent, storage]
    AgentReadiness:
      type: object
      properties:
        provider: { type: string }
        runtime: { type: string }
        deploymentTarget: { type: string }
        model: { type: string }
        status: { type: string, enum: [ready, not_configured] }
        apiKeyConfigured: { type: boolean }
        cloudProjectConfigured: { type: boolean }
        agentEngineConfigured: { type: boolean }
      required: [provider, runtime, deploymentTarget, model, status, apiKeyConfigured, cloudProjectConfigured, agentEngineConfigured]
    StorageReadiness:
      type: object
      properties:
        provider: { type: string }
        status: { type: string, enum: [ready, configuration_required] }
        bucketConfigured: { type: boolean }
        privateDirectoryConfigured: { type: boolean }
      required: [provider, status, bucketConfigured, privateDirectoryConfigured]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        code: { type: string }
      required: [error]
    Project:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        type: { type: string }
        status: { type: string }
        sceneCount: { type: number }
        activeIssueCount: { type: number }
        updatedAt: { type: string, format: date-time }
      required: [id, title, type, status, sceneCount, activeIssueCount, updatedAt]
    ProjectInput:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string, default: short_film }
      required: [title]
    ProjectUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        type: { type: string }
        status: { type: string }
    ProjectDetail:
      allOf:
        - $ref: "#/components/schemas/Project"
        - type: object
          properties:
            scenes:
              type: array
              items: { $ref: "#/components/schemas/Scene" }
          required: [scenes]
    Scene:
      type: object
      properties:
        id: { type: string }
        projectId: { type: string }
        sceneNumber: { type: string }
        slugline: { type: string }
        location: { type: string }
        intExt: { type: string }
        timeOfDay: { type: string }
        storyDay: { type: string }
        scriptText: { type: [string, "null"] }
        shotCount: { type: number }
        continuityCount: { type: number }
